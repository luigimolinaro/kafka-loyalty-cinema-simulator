apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api-point-b
  namespace: kafka
  labels:
    app: backend-api
    collection-point: point-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api
      collection-point: point-b
  template:
    metadata:
      labels:
        app: backend-api
        collection-point: point-b
    spec:
      containers:
      - name: backend-api
        image: points-backend-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        - name: KAFKA_BROKER
          value: "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
        - name: KAFKA_TOPIC
          value: "points-events"
        - name: COLLECTION_POINT
          value: "point-b"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api-point-b
  namespace: kafka
  labels:
    app: backend-api
    collection-point: point-b
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: backend-api
    collection-point: point-b
