apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-service
  namespace: kafka
  labels:
    app: consumer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer-service
  template:
    metadata:
      labels:
        app: consumer-service
    spec:
      containers:
      - name: consumer
        image: points-consumer-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
          name: http
        env:
        - name: KAFKA_BROKER
          value: "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
        - name: KAFKA_TOPIC
          value: "points-events"
        - name: CONSUMER_GROUP
          value: "points-processor"
        - name: HTTP_PORT
          value: "3001"
        - name: REDIS_HOST
          value: "redis.kafka.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: consumer-service
  namespace: kafka
  labels:
    app: consumer-service
spec:
  selector:
    app: consumer-service
  ports:
  - name: http
    port: 3001
    targetPort: 3001
    protocol: TCP
  type: ClusterIP
